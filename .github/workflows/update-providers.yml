name: Sync Built-in Providers

on:
  schedule:
    - cron: '0 */3 * * *' # Every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync catalog from models.dev
        run: |
          set -euo pipefail
          python3 scripts/update_providers.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD -- builtin_providers.toml; then
            echo "No changes in builtin_providers.toml"
          else
            git diff --stat HEAD -- builtin_providers.toml
            git add builtin_providers.toml
            git commit -m "chore(catalog): sync builtin_providers.toml [skip ci]"
            git push origin HEAD:master
          fi
